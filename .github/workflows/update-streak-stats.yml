name: Update streak stats

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch streak stats SVG
        run: |
          for i in 1 2 3 4 5; do
            if curl -sf "https://streak-stats.demolab.com/?user=Narasimha2211&hide_border=true" -o /tmp/streak.svg; then
              if ! grep -qi "Failed to retrieve\|Error Fetching\|API issue" /tmp/streak.svg; then
                break
              fi
            fi
            echo "Attempt $i failed or returned an error response, retrying..."
            sleep 15
          done

          if grep -qi "Failed to retrieve\|Error Fetching\|API issue" /tmp/streak.svg; then
            echo "All attempts returned an error response. Leaving existing committed file untouched."
            exit 0
          fi

          mkdir -p assets
          cp /tmp/streak.svg assets/streak-stats.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/streak-stats.svg
          git diff --staged --quiet || git commit -m "Update streak stats [skip ci]"
          git push
